name: CI

on:
  push:
    branches: [master, fix/**]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run benchmark
        run: ./build/np_bench

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run benchmark
        continue-on-error: true
        run: .\build\Release\np_bench.exe
